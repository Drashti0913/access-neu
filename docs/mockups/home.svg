<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Arial, sans-serif" font-size="13">
<title>Home page wireframe</title>
<rect width="900" height="640" fill="#fafafa" stroke="#999"/>
<rect width="900" height="48" fill="#ddd"/>
<text x="20" y="30" font-size="18" font-weight="700">AccessNEU</text>
<text x="600" y="30">Home</text><text x="660" y="30">Access reports</text><text x="780" y="30">Quiet spaces</text>
<text x="20" y="100" font-size="30" fill="#333" font-weight="700">Know before you go.</text><text x="20" y="128" font-size="14" fill="#555" font-weight="400">Community board for campus barriers and quiet study spaces.</text><rect x="20" y="155" width="420" height="150" rx="6" fill="#fff" stroke="#777"/><rect x="20" y="155" width="420" height="6" fill="#555"/><text x="36" y="190" font-size="17" fill="#333" font-weight="700">Access reports</text><text x="36" y="218" font-size="13" fill="#333" font-weight="400">497 open barrier reports (live count)</text><text x="36" y="240" font-size="12" fill="#555" font-weight="400">Short explanation of the feature.</text><rect x="36" y="258" width="173.20000000000002" height="28" rx="5" fill="#555" stroke="#555"/><text x="122.60000000000001" y="276" text-anchor="middle" fill="#fff">Browse access reports</text><rect x="460" y="155" width="420" height="150" rx="6" fill="#fff" stroke="#777"/><rect x="460" y="155" width="420" height="6" fill="#555"/><text x="476" y="190" font-size="17" fill="#333" font-weight="700">Quiet spaces</text><text x="476" y="218" font-size="13" fill="#333" font-weight="400">300 study spaces listed (live count)</text><text x="476" y="240" font-size="12" fill="#555" font-weight="400">Short explanation of the feature.</text><rect x="476" y="258" width="151.6" height="28" rx="5" fill="#555" stroke="#555"/><text x="551.8" y="276" text-anchor="middle" fill="#fff">Find a quiet space</text><rect x="20" y="330" width="860" height="280" rx="6" fill="#fff" stroke="#777"/><text x="36" y="360" font-size="17" fill="#333" font-weight="700">How to use AccessNEU</text><text x="36" y="392" font-size="14" fill="#333" font-weight="700">Access reports</text><text x="36" y="420" font-size="13" fill="#333" font-weight="400">1. Open Access reports</text><text x="36" y="446" font-size="13" fill="#333" font-weight="400">2. Filter by building, category, status</text><text x="36" y="472" font-size="13" fill="#333" font-weight="400">3. Fill in 'Report a barrier' and submit</text><text x="36" y="498" font-size="13" fill="#333" font-weight="400">4. Mark resolved, Edit or Delete a card</text><text x="456" y="392" font-size="14" fill="#333" font-weight="700">Quiet spaces</text><text x="456" y="420" font-size="13" fill="#333" font-weight="400">1. Open Quiet spaces</text><text x="456" y="446" font-size="13" fill="#333" font-weight="400">2. Filter by noise, lighting, feature</text><text x="456" y="472" font-size="13" fill="#333" font-weight="400">3. Fill in 'Add a quiet space'</text><text x="456" y="498" font-size="13" fill="#333" font-weight="400">4. Edit hours or Delete a closed space</text><text x="36" y="585" font-size="12" fill="#555" font-weight="400">No account needed. Keep reports factual.</text>
</svg>
